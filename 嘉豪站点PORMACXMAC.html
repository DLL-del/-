/* ===== 嘉豪头像 ===== */
.jiahao-avatar{
    display:block;margin:24px auto 20px;

}

/* ===== 右下角音乐按钮 ===== */
.music-btn{
    position:fixed;right:16px;bottom:16px;z-index:9999;
    width:48px;height:48px;border-radius:50%;
    border:2px solid rgba(0,170,255,.5);
    background:rgba(0,40,80,.7);backdrop-filter:blur(6px);
    color:#00ddff;font-size:20px;
    cursor:pointer;display:flex;align-items:center;justify-content:center;
    transition:all .3s;
}
.music-btn.muted{color:rgba(255,255,255,.3);border-color:rgba(255,255,255,.15);}
.music-btn.muted::after{
    content:'';position:absolute;
    width:24px;height:3px;background:#00ddff;

/* ===== 音量控制条 ===== */
.volume-container{
    position:fixed;right:16px;bottom:72px;z-index:9999;

    background:rgba(0,40,80,.7);backdrop-filter:blur(6px);
    border:2px solid rgba(0,170,255,.5);border-radius:24px;
    padding:6px 12px;
    transition:opacity .3s,transform .3s;
    opacity:1;transform:translateY(0);pointer-events:auto;
}
.volume-container.show{opacity:1;transform:translateY(0);pointer-events:auto;}
.volume-container .vol-icon{font-size:16px;color:#00ddff;cursor:pointer;user-select:none;}
.volume-container input[type=range]{
    -webkit-appearance:none;appearance:none;
    width:100px;height:4px;border-radius:2px;
    background:linear-gradient(to right,#00ddff 0%,#00ddff 80%,rgba(255,255,255,.2) 80%);

}
.volume-container input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;
    width:14px;height:14px;border-radius:50%;
    background:#00ddff;cursor:pointer;
    box-shadow:0 0 6px #00aaff;border:none;
}
.volume-container input[type=range]::-moz-range-thumb{
    width:14px;height:14px;border-radius:50%;
    background:#00ddff;cursor:pointer;
    box-shadow:0 0 6px #00aaff;border:none;
}
.volume-container .vol-value{
    color:#00ddff;font-size:12px;font-weight:700;

(function(){
    const canvas = document.getElementById('matrixCanvas');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    let w = canvas.width = innerWidth, h = canvas.height = innerHeight;
    const fontSize = 18, cols = Math.floor(w / fontSize);
    const drops = Array.from({ length: cols }, () => ({
        y: Math.random() * -h / fontSize,
        chars: (Math.random() > 0.5 ? '1' : '0'),
        tailLen: 8 + Math.floor(Math.random() * 18)
    }));

    function generateBinaryString(len){
        let s = '';
        for (let i = 0; i < len; i++) s += Math.random() > 0.5 ? '1' : '0';
        return s;
    }

    let animId;
    function draw(){
        ctx.fillStyle = 'rgba(0,0,0,0.08)';
        ctx.fillRect(0, 0, w, h);
        ctx.font = fontSize + 'px monospace';
        for (let i = 0; i < cols; i++){
            const d = drops[i];
            for (let j = 0; j < d.chars.length && j < d.tailLen; j++){
                const alpha = 1 - j / d.tailLen;
                ctx.fillStyle = j === 0 ? '#0f0' : `rgba(0,255,0,${alpha * 0.6})`;
                ctx.fillText(d.chars[j], i * fontSize, (d.y - j) * fontSize);
            }
            d.y += 1;
            if (Math.random() > 0.92) {
                d.chars = (Math.random() > 0.5 ? '1' : '0') + d.chars.slice(0, -1);
            } else {
                d.chars = d.chars.slice(0, -1);
            }
            if (Math.random() > 0.7) d.chars += Math.random() > 0.5 ? '1' : '0';
            if (d.y * fontSize > h + d.tailLen * fontSize && Math.random() > 0.9) {
                d.y = Math.random() * -10 - 5;
                d.chars = generateBinaryString(1 + Math.floor(Math.random() * 8));
                d.tailLen = 8 + Math.floor(Math.random() * 18);
            }
        }
        animId = requestAnimationFrame(draw);
    }
    draw();
    window.addEventListener('resize', () => {
        w = canvas.width = innerWidth;
        h = canvas.height = innerHeight;
    });
    window._matrixAnimId = animId;
})();

(function(){

/* ===== 密码强度校验 ===== */
function validatePassword(p){
    if (p.length < 3 || p.length > 10) return '密码需3-10位字符';
    if (!/[A-Z]/.test(p)) return '密码需包含至少一个大写字母';
    if (!/[a-z]/.test(p)) return '密码需包含至少一个小写字母';
    if (!/[0-9]/.test(p)) return '密码需包含至少一个数字';
    return null;
}

/* ===== 注册 ===== */
document.getElementById('registerForm').onsubmit = async e => {
    e.preventDefault();
    const u = regUsername.value.trim(), p = regPassword.value;

    if (u.length < 3 || u.length > 10) { showToast('用户名需3-10位字符'); return; }
    if (!/^[a-zA-Z0-9_]+$/.test(u)) { showToast('用户名仅允许字母、数字、下划线'); return; }

    const pwdErr = validatePassword(p);
    if (pwdErr) { showToast(pwdErr); return; }
    if (p !== regConfirmPwd.value) { showToast('两次密码不一致'); return; }

    const users = JSON.parse(localStorage.getItem('mcUsers') || '{}');
    if (users[u]) { showToast('注册失败：用户已存在'); return; }

    users[u] = await sha256(p);
    localStorage.setItem('mcUsers', JSON.stringify(users));
    showToast('🎉 注册成功！请登录');
    switchTab('login');
    regUsername.value = ''; regPassword.value = ''; regConfirmPwd.value = '';
};

/* ===== 登录 ===== */
document.getElementById('loginForm').onsubmit = async e => {
    e.preventDefault();
    const u = loginUsername.value.trim();
    const p = loginPassword.value;

    const lastAttempt = localStorage.getItem('lastAttempt_' + u);
    if (lastAttempt && Date.now() - Number(lastAttempt) < 3000) {
        showToast('操作过于频繁，请3秒后再试');
        return;
    }
    localStorage.setItem('lastAttempt_' + u, Date.now());

    const users = JSON.parse(localStorage.getItem('mcUsers') || '{}');
    if (!users[u]) {
        showToast('登录失败：账号不存在');
        return;
    }
    if (users[u] === await sha256(p)){
        localStorage.setItem('currentUser', u);
        loginUsername.value = ''; loginPassword.value = '';
        updateLoginState();
        closeModal();
        showToast('🎉 登录成功！欢迎回来，' + u);
    } else {
        showToast('登录失败：密码错误');
    }
};

    list.slice().reverse().forEach((fb, i) => {
        const idx = list.length - 1 - i;
        const isGuest = fb.user === '游客';
        const deleteBtn = isGuest
            ? '<button class="feedback-delete" onclick="deleteFeedback(' + idx + ')" title="删除此评论">\u00D7</button>'
            : '';
        box.innerHTML += '<div class="feedback-item">' +
            '<b>' + fb.user + '</b>' +
            '<div class="fb-text">' + fb.text + '</div>' +
            '<span>' + fb.time + '</span>' +
            deleteBtn +
            '</div>';
    });
}
function addFeedback(){
    const text = feedbackInput.value.trim();
    if (!text) { showToast('内容不能为空'); return; }
    if (text.length > 100) { showToast('每条评论最多100个字'); return; }
    const key = todayKey();
    const count = Number(localStorage.getItem(key) || 0);
    if (count >= 3) { showToast('今日已达3条上限'); return; }
    const user = localStorage.getItem('currentUser') || '游客';
    const list = JSON.parse(localStorage.getItem('siteFeedback') || '[]');
    list.push({ user, text, time: new Date().toLocaleString() });
    localStorage.setItem('siteFeedback', JSON.stringify(list));
    localStorage.setItem(key, count + 1);
    feedbackInput.value = '';
    loadFeedback();
    showToast('发送成功');
}
function deleteFeedback(i){
    const list = JSON.parse(localStorage.getItem('siteFeedback') || '[]');
    if (!list[i]) { showToast('评论不存在'); return; }
    if (list[i].user !== '游客') { showToast('只能删除游客的评论'); return; }
    if (!confirm('确定删除这条游客评论吗？')) return;
    const key = todayKey();
    const count = Number(localStorage.getItem(key) || 0);
    localStorage.setItem(key, Math.max(0, count - 1));
    list.splice(i, 1);
    localStorage.setItem('siteFeedback', JSON.stringify(list));
    loadFeedback();
    showToast('已删除，可再发一条');
}

/* ===== 弹窗控制 ===== */
function openModal(){ document.getElementById('loginModal').classList.add('show'); }
function closeModal(){ document.getElementById('loginModal').classList.remove('show'); }
function switchTab(t){
    document.querySelectorAll('.modal-tabs button').forEach(b => b.classList.remove('active'));
    document.getElementById('loginForm').classList.toggle('hidden', t !== 'login');
    document.getElementById('registerForm').classList.toggle('hidden', t !== 'register');
    document.querySelector('.modal-tabs button:nth-child(' + (t === 'login' ? '1' : '2') + ')').classList.add('active');
}

/* ===== SHA-256 ===== */
async function sha256(t){
    const b = new TextEncoder().encode(t);
    const h = await crypto.subtle.digest('SHA-256', b);
    return [...new Uint8Array(h)].map(x => x.toString(16).padStart(2, '0')).join('');
}

/* ===== 搜索相关逻辑 ===== */
const RECENT_ENGINE_KEY = 'mc_recent_engines';
const searchEngineSelect = document.getElementById('searchEngine');
const searchBtn = document.getElementById('searchBtn');
const searchInput = document.getElementById('searchInput');

// 辅助函数：颜色变浅
function lightenColor(color, percent) {
    const num = parseInt(color.replace('#', ''), 16);
    const amt = Math.round(2.55 * percent);
    const R = (num >> 16) + amt;
    const G = (num >> 8 & 0x00FF) + amt;
    const B = (num & 0x0000FF) + amt;
    return `#${(
        0x1000000 +
        (R < 255 ? R < 1 ? 0 : R : 255) * 0x10000 +
        (G < 255 ? G < 1 ? 0 : G : 255) * 0x100 +
        (B < 255 ? B < 1 ? 0 : B : 255)
    ).toString(16).slice(1)}`;
}

// 更新搜索按钮文字和颜色
function updateSearchBtn(text, color) {
    searchBtn.textContent = `搜${text.replace(/（.*）/, '')}`;
    searchBtn.style.background = `linear-gradient(90deg, ${color}, ${lightenColor(color, 30)})`;
}

// 加载最近使用的引擎
function loadRecentEngines() {
    const recent = JSON.parse(localStorage.getItem(RECENT_ENGINE_KEY) || '[]');
    const recentGroup = searchEngineSelect.querySelector('optgroup[label="🕒 最近使用"]');
    recentGroup.innerHTML = '';
    if (recent.length === 0) {
        recentGroup.style.display = 'none';
    } else {
        recentGroup.style.display = 'block';
        recent.forEach(item => {
            const option = document.createElement('option');
            option.value = item.value;
            option.textContent = item.text;
            option.dataset.color = item.color;
            recentGroup.appendChild(option);
        });
        // 默认选中最近使用的第一个
        searchEngineSelect.value = recent[0].value;
        updateSearchBtn(recent[0].text, recent[0].color);
    }
}

// 保存最近使用的引擎（最多3个，去重）
function saveRecentEngine(value, text, color) {
    let recent = JSON.parse(localStorage.getItem(RECENT_ENGINE_KEY) || '[]');
    recent = recent.filter(item => item.value !== value);
    recent.unshift({ value, text, color });
    recent = recent.slice(0, 3);
    localStorage.setItem(RECENT_ENGINE_KEY, JSON.stringify(recent));
    loadRecentEngines();
}

// 执行搜索
function doSearch() {
    const keyword = searchInput.value.trim();
    if (!keyword) {
        showToast('请输入搜索内容');
        return;
    }
    const selected = searchEngineSelect.options[searchEngineSelect.selectedIndex];
    const engineUrl = selected.value;
    const engineText = selected.textContent;
    const engineColor = selected.dataset.color;
    saveRecentEngine(engineUrl, engineText, engineColor);
    window.open(engineUrl + encodeURIComponent(keyword), '_blank');
}

// 快捷搜索
function quickSearch(keyword) {
    searchInput.value = keyword;
    doSearch();
}

// 绑定事件
searchEngineSelect.addEventListener('change', function() {
    const selected = this.options[this.selectedIndex];
    updateSearchBtn(selected.textContent, selected.dataset.color);
});
searchBtn.addEventListener('click', doSearch);
searchInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') doSearch();
});

// 页面加载初始化
window.addEventListener('DOMContentLoaded', () => {
    loadRecentEngines();
    // 无最近使用时默认选中MC百科
    if (!localStorage.getItem(RECENT_ENGINE_KEY)) {
        const defaultOption = searchEngineSelect.querySelector('option[value="https://www.mcmod.cn/search/?key="]');
        if (defaultOption) {
            defaultOption.selected = true;
            updateSearchBtn(defaultOption.textContent, defaultOption.dataset.color);
        }
    }
});
</script>
