/* ===== 右下角音乐按钮 ===== */
.music-btn{

.volume-container .vol-icon{font-size:16px;color:#00ddff;cursor:pointer;user-select:none;}
.volume-container input[type=range]{

.volume-container input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;
    width:14px;height:14px;border-radius:50%;
    background:#00ddff;cursor:pointer;

}
.volume-container input[type=range]::-moz-range-thumb{
    width:14px;height:14px;border-radius:50%;
    background:#00ddff;cursor:pointer;
    box-shadow:0 0 6px #00aaff;border:none;
}
.volume-container .vol-value{

let toastTimer = null;
function showToast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.remove('show');
    void t.offsetWidth;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2000);
}

(function(){
    const canvas = document.getElementById('matrixCanvas');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    let w = canvas.width = innerWidth, h = canvas.height = innerHeight;
    const fontSize = 18, cols = Math.floor(w / fontSize);
    // 每列保存：当前 y 位置、一串由 0/1 交替组成的尾巴字符列表、尾巴长度
    const drops = Array.from({ length: cols }, () => ({
        y: Math.random() * -h / fontSize,          // 起始 y（列索引单位）
        chars: generateBinaryString(1 + Math.floor(Math.random() * 18)), // 尾巴字符
        tailLen: 8 + Math.floor(Math.random() * 18) // 尾巴长度
    }));

    function generateBinaryString(len){
        let s = '';
        for (let i = 0; i < len; i++) s += Math.random() > 0.5 ? '1' : '0';
        return s;
    }

    let animId;
    function draw(){
        // 半透明黑色覆盖，产生拖尾效果
        ctx.fillStyle = 'rgba(0,0,0,0.08)';
        ctx.fillRect(0, 0, w, h);
        ctx.font = fontSize + 'px monospace';

        for (let i = 0; i < cols; i++){
            const d = drops[i];
            // 逐字符绘制尾巴：头部亮绿，尾部逐渐变暗
            for (let j = 0; j < d.chars.length && j < d.tailLen; j++){
                const alpha = 1 - j / d.tailLen;   // 越远越透明
                ctx.fillStyle = j === 0
                    ? '#0f0'                       // 头部最亮
                    : `rgba(0,255,0,${alpha * 0.6})`; // 尾巴渐隐
                ctx.fillText(d.chars[j], i * fontSize, (d.y - j) * fontSize);
            }
            // 向下移动
            d.y += 1;
            // 有一定概率更新头部字符，让 0/1 交替闪烁
            if (Math.random() > 0.92) {
                d.chars = Math.random() > 0.5 ? '1' + d.chars.slice(0, -1) : '0' + d.chars.slice(0, -1);
            } else {
                d.chars = d.chars.slice(0, -1); // 移除尾部
            }
            // 随机补充新字符到尾部
            if (Math.random() > 0.7) {
                d.chars += Math.random() > 0.5 ? '1' : '0';
            }
            // 超出画布后重置
            if (d.y * fontSize > h + d.tailLen * fontSize && Math.random() > 0.9) {
                d.y = Math.random() * -10 - 5;
                d.chars = generateBinaryString(1 + Math.floor(Math.random() * 8));
                d.tailLen = 8 + Math.floor(Math.random() * 18);
            }
        }
        animId = requestAnimationFrame(draw);
    }
    draw();
    window.addEventListener('resize', () => {
        w = canvas.width = innerWidth;
        h = canvas.height = innerHeight;
    });
    window._matrixAnimId = animId;
})();

/* ===== 低配模式 ===== */
let lowPcOn = true;
function toggleLowPC(){
    lowPcOn = !lowPcOn;
    document.body.classList.toggle('lowpc', !lowPcOn);
    document.getElementById('lowPcBtn').textContent = lowPcOn ? '低配模式：开' : '低配模式：关';
    if (!lowPcOn){
        if (window._matrixAnimId) { cancelAnimationFrame(window._matrixAnimId); window._matrixAnimId = null; }
        document.getElementById('matrixCanvas').style.display = 'none';
        showToast('低配模式已开启');
    } else {
        document.getElementById('matrixCanvas').style.display = 'block';
        showToast('低配模式已关闭');
        // 重新启动动画
        initMatrix();
    }
}

/* 独立的代码雨初始化函数，供低配模式切换时重新调用 */
function initMatrix(){
    const canvas = document.getElementById('matrixCanvas');
    if (!canvas || document.body.classList.contains('lowpc')) return;
    const ctx = canvas.getContext('2d');
    let w = canvas.width = innerWidth, h = canvas.height = innerHeight;
    const fontSize = 18, cols = Math.floor(w / fontSize);
    const drops = Array.from({ length: cols }, () => ({
        y: Math.random() * -h / fontSize,
        chars: (Math.random() > 0.5 ? '1' : '0'),
        tailLen: 8 + Math.floor(Math.random() * 18)
    }));

    function generateBinaryString(len){
        let s = '';
        for (let i = 0; i < len; i++) s += Math.random() > 0.5 ? '1' : '0';
        return s;
    }

    function draw(){
        ctx.fillStyle = 'rgba(0,0,0,0.08)';
        ctx.fillRect(0, 0, w, h);
        ctx.font = fontSize + 'px monospace';
        for (let i = 0; i < cols; i++){
            const d = drops[i];
            for (let j = 0; j < d.chars.length && j < d.tailLen; j++){
                const alpha = 1 - j / d.tailLen;
                ctx.fillStyle = j === 0 ? '#0f0' : `rgba(0,255,0,${alpha * 0.6})`;
                ctx.fillText(d.chars[j], i * fontSize, (d.y - j) * fontSize);
            }
            d.y += 1;
            if (Math.random() > 0.92) {
                d.chars = (Math.random() > 0.5 ? '1' : '0') + d.chars.slice(0, -1);
            } else {
                d.chars = d.chars.slice(0, -1);
            }
            if (Math.random() > 0.7) d.chars += Math.random() > 0.5 ? '1' : '0';
            if (d.y * fontSize > h + d.tailLen * fontSize && Math.random() > 0.9) {
                d.y = Math.random() * -10 - 5;
                d.chars = generateBinaryString(1 + Math.floor(Math.random() * 8));
                d.tailLen = 8 + Math.floor(Math.random() * 18);
            }
        }
        window._matrixAnimId = requestAnimationFrame(draw);
    }
    draw();
}

/* ===== 背景音乐 ===== */
const SONGS = ['Friendships Plain Jane.mp3', 'Friendships Plain Jane.mp3'];
function pickSong(){ return SONGS[Math.floor(Math.random() * SONGS.length)]; }

// 初始化音量
(function(){
    const m = document.getElementById('bgMusic');
    const savedVol = localStorage.getItem('mcMusicVolume');
    const vol = savedVol !== null ? Number(savedVol) : 80;
    m.volume = vol / 100;
    const slider = document.getElementById('volumeSlider');
    const valLabel = document.getElementById('volValue');
    slider.value = vol;
    valLabel.textContent = vol + '%';
    updateVolBackground(vol);
    if (vol === 0) document.getElementById('volIcon').textContent = '🔇';
})();

function showVolumeBar(){
    const vc = document.getElementById('volumeContainer');
    vc.classList.add('show');
}

function updateVolBackground(val){
    const slider = document.getElementById('volumeSlider');
    slider.style.background = 'linear-gradient(to right,#00ddff 0%,#00ddff ' + val + '%,rgba(255,255,255,.2) ' + val + '%)';
}

function changeVolume(val){
    const m = document.getElementById('bgMusic');
    const v = Number(val);
    m.volume = v / 100;
    localStorage.setItem('mcMusicVolume', v);
    document.getElementById('volValue').textContent = v + '%';
    updateVolBackground(v);
    document.getElementById('volIcon').textContent = v === 0 ? '🔇' : '🔊';
    if (v > 0 && m.paused){
        // 用户拖动到非0音量且音乐暂停时自动恢复播放
        if (!m.src || m.ended) m.src = pickSong();
        m.play().catch(() => {});
        document.getElementById('musicBtn').classList.remove('muted');
    }
    if (v === 0 && !m.paused){
        m.pause();
        document.getElementById('musicBtn').classList.add('muted');
    }
    showVolumeBar();
}

function toggleMute(){
    const m = document.getElementById('bgMusic');
    const slider = document.getElementById('volumeSlider');
    if (m.volume > 0){
        // 静音，记住当前值
        slider.dataset.lastVol = slider.value;
        changeVolume(0);
    } else {
        // 恢复
        const last = slider.dataset.lastVol || 80;
        changeVolume(last);
    }
}

function toggleMusic(){
    const m = document.getElementById('bgMusic');
    const btn = document.getElementById('musicBtn');
    if (m.paused){
        if (!m.src || m.ended) m.src = pickSong();
        m.play().catch(() => {});
        btn.classList.remove('muted');
    } else {
        m.pause();
        btn.classList.add('muted');
    }
    showVolumeBar();
}

// 音量条默认常驻显示，无需悬停触发

document.getElementById('bgMusic').addEventListener('ended', function(){
    this.src = pickSong();
    this.play().catch(() => {});
});

/* ===== 在线人数 ===== */
(function(){
    const SITE_KEY = 'mc_site_visitors', MY_ID_KEY = 'mc_my_visitor_id';
    let myId = localStorage.getItem(MY_ID_KEY);
    if (!myId){
        myId = 'v_' + Date.now() + '_' + Math.random().toString(36).substring(2, 8);
        localStorage.setItem(MY_ID_KEY, myId);
    }
    let visitors = JSON.parse(localStorage.getItem(SITE_KEY) || '[]');
    const now = Date.now();
    visitors = visitors.filter(v => now - v.ts < 300000);
    const me = visitors.find(v => v.id === myId);
    if (me) me.ts = now; else visitors.push({ id: myId, ts: now });
    localStorage.setItem(SITE_KEY, JSON.stringify(visitors));
    document.getElementById('onlineNum').textContent = '在线：' + visitors.length + ' 人';

    setInterval(() => {
        let list = JSON.parse(localStorage.getItem(SITE_KEY) || '[]');
        const n = Date.now();
        list = list.filter(v => n - v.ts < 300000);
        const self = list.find(v => v.id === myId);
        if (self) self.ts = n; else list.push({ id: myId, ts: n });
        localStorage.setItem(SITE_KEY, JSON.stringify(list));
        document.getElementById('onlineNum').textContent = '在线：' + list.length + ' 人';
    }, 3000);
})();

/* ===== 登录状态 ===== */
const defaultAvatar = 'https://minotar.net/avatar/steve/100.png';

function updateLoginState(){
    const u = localStorage.getItem('currentUser');
    const el = document.getElementById('loginStatus');
    const text = document.getElementById('loginText');
    const avatar = document.getElementById('topAvatar');
    if (u){
        el.className = 'topbar logged-in';
        text.textContent = '\uD83D\uDC64 ' + u;
        avatar.src = localStorage.getItem('avatar_' + u) || defaultAvatar;
    } else {
        el.className = 'topbar logged-out';
        text.textContent = '\u26A0 未登录';
        avatar.src = '';  // 未登录不显示头像
    }
    loadFeedback();
}
updateLoginState();

/* ===== 头像管理 ===== */
function openAvatarCenter(){
    if (!localStorage.getItem('currentUser')) { showToast('请先登录'); return; }
    document.getElementById('avatarPreview').src = document.getElementById('topAvatar').src;
    document.getElementById('avatarModal').classList.add('show');
}
function previewAvatar(e){
    const f = e.target.files[0];
    if (!f || !f.type.startsWith('image/')) { showToast('仅支持图片文件'); return; }
    const r = new FileReader();
    r.onload = ev => document.getElementById('avatarPreview').src = ev.target.result;
    r.readAsDataURL(f);
}
function saveAvatar(){
    const u = localStorage.getItem('currentUser');
    if (!u) return;
    localStorage.setItem('avatar_' + u, document.getElementById('avatarPreview').src);
    updateLoginState();
    closeModalAvatar();
    showToast('头像已保存');
}
function closeModalAvatar(){ document.getElementById('avatarModal').classList.remove('show'); }

/* ===== 密码强度校验 ===== */
function validatePassword(p){
    if (p.length < 3 || p.length > 10) return '密码需3-10位字符';
    if (!/[A-Z]/.test(p)) return '密码需包含至少一个大写字母';
    if (!/[a-z]/.test(p)) return '密码需包含至少一个小写字母';
    if (!/[0-9]/.test(p)) return '密码需包含至少一个数字';
    return null;
}

/* ===== 注册 ===== */
document.getElementById('registerForm').onsubmit = async e => {
    e.preventDefault();
    const u = regUsername.value.trim(), p = regPassword.value;

    if (u.length < 3 || u.length > 10) { showToast('用户名需3-10位字符'); return; }
    if (!/^[a-zA-Z0-9_]+$/.test(u)) { showToast('用户名仅允许字母、数字、下划线'); return; }

    const pwdErr = validatePassword(p);
    if (pwdErr) { showToast(pwdErr); return; }
    if (p !== regConfirmPwd.value) { showToast('两次密码不一致'); return; }

    const users = JSON.parse(localStorage.getItem('mcUsers') || '{}');
    if (users[u]) { showToast('注册失败：用户已存在'); return; }

    users[u] = await sha256(p);
    localStorage.setItem('mcUsers', JSON.stringify(users));
    showToast('🎉 注册成功！请登录');
    switchTab('login');
    regUsername.value = ''; regPassword.value = ''; regConfirmPwd.value = '';
};

/* ===== 登录 ===== */
document.getElementById('loginForm').onsubmit = async e => {
    e.preventDefault();
    const u = loginUsername.value.trim();
    const p = loginPassword.value;

    const lastAttempt = localStorage.getItem('lastAttempt_' + u);
    if (lastAttempt && Date.now() - Number(lastAttempt) < 3000) {
        showToast('操作过于频繁，请3秒后再试');
        return;
    }
    localStorage.setItem('lastAttempt_' + u, Date.now());

    const users = JSON.parse(localStorage.getItem('mcUsers') || '{}');
    if (!users[u]) {
        showToast('登录失败：账号不存在');
        return;
    }
    if (users[u] === await sha256(p)){
        localStorage.setItem('currentUser', u);
        loginUsername.value = ''; loginPassword.value = '';
        updateLoginState();
        closeModal();
        showToast('🎉 登录成功！欢迎回来，' + u);
    } else {
        showToast('登录失败：密码错误');
    }
};

function logout(){
    if (!confirm('确定退出登录？')) return;
    localStorage.removeItem('currentUser');
    updateLoginState();
    showToast('已退出登录');
}

/* ===== 留言功能 ===== */
function getGuestId(){
    let id = localStorage.getItem('guestId');
    if (!id) { id = 'guest_' + crypto.randomUUID(); localStorage.setItem('guestId', id); }
    return id;
}
function todayKey(){
    const user = localStorage.getItem('currentUser') || getGuestId();
    return 'fb_' + user + '_' + new Date().toDateString();
}
function loadFeedback(){
    const list = JSON.parse(localStorage.getItem('siteFeedback') || '[]');
    const box = document.getElementById('feedbackList');
    box.innerHTML = '';
    list.slice().reverse().forEach((fb, i) => {
        const idx = list.length - 1 - i;
        const isGuest = fb.user === '游客';
        const deleteBtn = isGuest
            ? '<button class="feedback-delete" onclick="deleteFeedback(' + idx + ')" title="删除此评论">\u00D7</button>'
            : '';
        box.innerHTML += '<div class="feedback-item">' +
            '<b>' + fb.user + '</b>' +
            '<div class="fb-text">' + fb.text + '</div>' +
            '<span>' + fb.time + '</span>' +
            deleteBtn +
            '</div>';
    });
}
function addFeedback(){
    const text = feedbackInput.value.trim();
    if (!text) { showToast('内容不能为空'); return; }
    if (text.length > 100) { showToast('每条评论最多100个字'); return; }
    const key = todayKey();
    const count = Number(localStorage.getItem(key) || 0);
    if (count >= 3) { showToast('今日已达3条上限'); return; }
    const user = localStorage.getItem('currentUser') || '游客';
    const list = JSON.parse(localStorage.getItem('siteFeedback') || '[]');
    list.push({ user, text, time: new Date().toLocaleString() });
    localStorage.setItem('siteFeedback', JSON.stringify(list));
    localStorage.setItem(key, count + 1);
    feedbackInput.value = '';
    loadFeedback();
    showToast('发送成功');
}
function deleteFeedback(i){
    const list = JSON.parse(localStorage.getItem('siteFeedback') || '[]');
    if (!list[i]) { showToast('评论不存在'); return; }
    if (list[i].user !== '游客') { showToast('只能删除游客的评论'); return; }
    if (!confirm('确定删除这条游客评论吗？')) return;
    const key = todayKey();
    const count = Number(localStorage.getItem(key) || 0);
    localStorage.setItem(key, Math.max(0, count - 1));
    list.splice(i, 1);
    localStorage.setItem('siteFeedback', JSON.stringify(list));
    loadFeedback();
    showToast('已删除，可再发一条');
}

/* ===== 弹窗控制 ===== */
function openModal(){ document.getElementById('loginModal').classList.add('show'); }
function closeModal(){ document.getElementById('loginModal').classList.remove('show'); }
function switchTab(t){
    document.querySelectorAll('.modal-tabs button').forEach(b => b.classList.remove('active'));
    document.getElementById('loginForm').classList.toggle('hidden', t !== 'login');
    document.getElementById('registerForm').classList.toggle('hidden', t !== 'register');
    document.querySelector('.modal-tabs button:nth-child(' + (t === 'login' ? '1' : '2') + ')').classList.add('active');
}

/* ===== SHA-256 ===== */
async function sha256(t){
    const b = new TextEncoder().encode(t);
    const h = await crypto.subtle.digest('SHA-256', b);
    return [...new Uint8Array(h)].map(x => x.toString(16).padStart(2, '0')).join('');
}
